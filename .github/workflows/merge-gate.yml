name: Merge gate

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: MergeするPR番号
        required: true
        type: number
      expected_head:
        description: 独立review済みの40桁head SHA
        required: true
        type: string
      execute_merge:
        description: 条件成立後のsquash mergeを明示指定する
        required: true
        default: false
        type: boolean

concurrency:
  group: merge-gate-main
  cancel-in-progress: false

jobs:
  merge:
    name: trusted merge gate
    if: github.ref == 'refs/heads/main' && inputs.execute_merge
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: write
      contents: write
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: current headを検査してsquash merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: >-
          python scripts/merge_gate.py "$PR_NUMBER" "$EXPECTED_HEAD"
          --execute --dispatch-after-merge
